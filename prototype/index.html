function verify() {
  const c = counts(), r = rating();
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const hit = S.review && S.review.chips.includes('있는 그대로 찍어줘요');

  const hero = (label, pctv, sub, desc) => card([
    el('div', { class: 'hero' }, [
      el('span', { class: 'l', text: label }),
      el('div', { class: 'row' }, [
        el('span', { class: 'n', text: pctv + '%' }),
        el('span', { class: 'p', text: '(' + sub + ')' }),
      ]),
      el('span', { class: 'd', text: desc }),
      el('div', { class: 'pbar' }, el('i', { style: `width:${pctv}%` })),
    ]),
  ]);

  const minor = (k, v) => el('div', { class: 'r' }, [
    el('span', { class: 'k', text: k }), el('span', { class: 'v', text: v }),
  ]);

  const inqSheet = (() => {
    if (!S.inqOpen) return null;
    S.inqDraft = S.inqDraft || { contact: '', when: '', msg: '' };
    const d = S.inqDraft;
    const fld = (label, key, ph) => el('div', { class: 'field' }, [
      el('label', { text: label }),
      el('input', { type: 'text', placeholder: ph, value: d[key],
        oninput: e => { d[key] = e.target.value; save(); } }),
    ]);
    const sendBtn = el('button', { class: 'proof' }, [el('span', { text: '의뢰 보내기' })]);
    sendBtn.addEventListener('click', () => {
      if (!d.contact.trim()) { flash('연락받을 방법을 남겨주세요', '시터가 답을 드릴 곳이 필요해요.'); render(); return; }
      S.inquiries.unshift({ id: 'q' + Date.now(), at: stampText().split(' ')[0], contact: d.contact.trim(), when: d.when.trim(), msg: d.msg.trim() });
      const body = `[돌봄 의뢰] 연락처: ${d.contact.trim()}` +
        (d.when.trim() ? ` / 시기: ${d.when.trim()}` : '') +
        (d.msg.trim() ? ` / 소개: ${d.msg.trim()}` : '');
      S.inqDraft = { contact: '', when: '', msg: '' };
      flash('문자 앱이 열려요', '전송 버튼만 누르면 시터에게 바로 전달됩니다.');
      set({ inqOpen: false });
      // V1: 서버 없이 시터 번호로 문자 초안을 연다 (모바일에서 동작)
      try { location.href = 'sms:01035490816?&body=' + encodeURIComponent(body); } catch (e) {}
    });
    return el('div', { class: 'sheetback',
      onclick: e => { if (e.target.classList.contains('sheetback')) set({ inqOpen: false }); } }, [
      el('div', { class: 'sheet' }, [
        el('div', { class: 'h', text: '돌봄 의뢰 보내기' }),
        el('div', { class: 'sub', text: '보내주시면 시터가 연락드려요. 계약 전에는 아무것도 결제되지 않습니다.' }),
        fld('연락받을 방법', 'contact', '예) 전화번호, 이메일'),
        fld('원하는 시기 (선택)', 'when', '예) 8월 마지막 주 2박 3일'),
        fld('한 줄 소개 (선택)', 'msg', '예) 말티즈 4살, 낯가림 있어요'),
        el('div', { class: 'btnrow sheetrow' }, [
          sendBtn,
          el('button', { class: 'sheetcancel', text: '취소', onclick: () => set({ inqOpen: false }) }),
        ]),
      ]),
    ]);
  })();

  return {
    title: '펫시터 프로필',
    overlay: inqSheet,
    back: S.role === 'owner' ? () => go(!S.onboarded ? 'welcome' : (S.sent ? 'home' : 'schedule')) : null,
    body: [
      card([
        el('div', { class: 'profhead' }, [
          el('div', { class: 'avatar' }),
          el('div', { class: 'pcol' }, [

            el('div', { class: 'meta', text: '방문 돌봄 · 서울 마포구' }),

            el('span', { class: 'st', text: `★ ${r.avg}` }),
            el('span', { class: 'cnt', text: `후기 ${r.n}` }),
          ]),
        ]),
      ]),

      // ── 숫자 3종이 주인공
      hero('약속 이행', pct(c.submitted, c.total), `${c.submitted} / ${c.total}건`,

      hero('보호자 확인', pct(c.checked, c.submitted), `${c.checked} / ${c.submitted}건`,
        '보낸 것을 보호자가 직접 보고 확인한 비율입니다. 보낸 것과 확인된 것은 다릅니다.'),

      card([
        el('div', { class: 'h', text: '이 시터에게 맡기고 싶다면' }),
        el('div', { class: 'sub', text: 'SNS에서 이 프로필을 보고 오셨나요? 의뢰를 남기면 시터가 직접 연락드립니다.' }),
        el('button', { class: 'cta inqcta', text: '돌봄 의뢰 보내기', onclick: () => set({ inqOpen: true }) }),
      ]),
      card([
        el('div', { class: 'h', text: '이 세 숫자만 보셔도 됩니다' }),
        el('div', { class: 'sub', text: '약속한 것을 얼마나 했고, 그중 얼마가 보호자에게 확인됐고, 어긋난 것은 어떻게 됐는지. 실시간 영상은 그 순간만 보여주고 사라지지만 이 숫자는 남습니다.' }),
      ]),

      // ── 보조 지표
      card([
        el('span', { class: 'veri' }, [icon('check-bold', 12), el('span', { text: '이 서비스에서 확인됨' })]),
        el('div', { class: 'minor' }, [
          minor('신원 인증', '정부 발급 신분증'),
          minor('앱 촬영 인증', '전 건 앱 카메라 · 시각 새김'),
          minor('가짜 인증 신고', `${c.disputes}건 중 ${c.resolved}건 해소` + (c.noreply ? ` · 무응답 ${c.noreply}` : '')),
          minor('사진 인증', `${c.photos}건`),
          minor('설명 인증', `${c.notes}건`),
          minor('다시 제출', `${c.resub}건`),
          minor('도착 직후 열람', `${c.seen} / ${c.submitted}건`),
          minor('산책 왕복 인증', '나갈 때·들어올 때 두 컷 · 시각 차이 기록'),
          minor('받은 리액션', `${c.reactions}개 (😍 😌 💙)`),

        el('div', { class: 'sub', text: '사진과 설명의 비율을 그대로 공개합니다. 사진이 많은 시터인지는 숫자로 바로 보입니다.' }),
      ]),

      hit ? card([
        el('div', { class: 'h', text: '보호자들이 꼽은 점' }),
        el('div', { class: 'chips' }, [el('span', { class: 'chip', 'aria-pressed': 'true', text: '있는 그대로 찍어줘요 · 1' })]),
      ]) : null,

      S.diaryBooks.length ? card([
        el('div', { class: 'secthead' }, [
          el('span', { class: 'unver' }, [icon('info', 12), el('span', { text: '시터 본인이 씀' })]),
          el('div', { class: 'h', text: `돌봄 일기 · ${S.diaryBooks.length}권` }),
          el('div', { class: 'sub', text: '돌본 아이마다 한 권씩입니다. 어떤 마음으로 돌보는 사람인지 여기서 보입니다.' }),

  return { title: '알림',
    body: [el('div', { class: 'empty', text: msg })],
    foot: [el('button', { class: 'cta', text: '그 화면으로', onclick: () => set({ role, screen }) })],
    hint: '' };
}

/* ---------------- render ---------------- */

const SCREENS = {
  owner:  { welcome, install, confirmInfo, petSetup, home: ownerHome, schedule, live, confirm: confirmScreen, review, verify, petProfile },
  sitter: { today, record, extra, reply, profile, sitterEdit, newContract, addReview, diaryWrite, diaryBook, careRecord },
  public: { verify, careRecord },
};

function render() {
  if (S.role === 'owner' && !S.onboarded && !['welcome', 'petSetup', 'confirmInfo', 'install', 'verify'].includes(S.screen)) S.screen = 'welcome';
  if (!(S.role === 'owner' && S.screen === 'live')) S._freshIds = null;   // live를 벗어나면 NEW 해제 (역할 전환 포함)
  const byRole = SCREENS[S.role];
  if (!byRole[S.screen]) S.screen = Object.keys(byRole)[0];
  const v = byRole[S.screen]();

  document.getElementById('bar').replaceChildren(
    ...[['owner','보호자'],['sitter','시터'],['public','공개']].map(([r,t]) =>
      el('button', { class: 'rolebtn', 'aria-pressed': S.role === r, text: t,
        onclick: () => set({ role: r, screen: r === 'owner' ? ownerDefault() : Object.keys(SCREENS[r])[0] }) })),
    el('button', { class: 'reset', text: '초기화',
      onclick: () => { localStorage.removeItem(KEY); S = load(); render(); } }),
  );

  document.getElementById('nav').replaceChildren(...[
    v.back ? el('button', { 'aria-label': '뒤로', onclick: v.back }, icon('chevron-left', 20)) : el('span', { class: 'sp' }),
    el('span', { class: 't', text: v.title }),
    v.rightExtra ? el('button', { class: 'navr bell', 'aria-label': v.rightExtra.label, onclick: v.rightExtra.on },
      [icon(v.rightExtra.icon, 20), v.rightExtra.badge ? el('span', { class: 'bdg', text: String(v.rightExtra.badge) }) : null]) : null,
    v.right ? el('button', { class: 'navr' + (v.right.icon ? ' bell' : ''), 'aria-label': v.right.label, onclick: v.right.on },
      v.right.icon
        ? [icon(v.right.icon, 20), v.right.badge ? el('span', { class: 'bdg', text: String(v.right.badge) }) : null]
        : [el('span', { text: v.right.label })]) : el('span', { class: 'sp' }),
  ].filter(Boolean));
  document.getElementById('body').replaceChildren(...v.body.filter(Boolean));
  const footEl = document.getElementById('foot');
  const footKids = (v.foot || []).filter(Boolean);
  footEl.replaceChildren(...footKids);
  footEl.style.display = footKids.length ? 'flex' : 'none';
  document.querySelectorAll('.fab').forEach(t => t.remove());
  if (v.fab) document.querySelector('.phone').appendChild(v.fab);
  document.querySelectorAll('.sheetback, .lightbox').forEach(t => t.remove());
  if (v.overlay) {
    if (S._sheetShown) {
      v.overlay.style.animation = 'none';
      const sh = v.overlay.querySelector('.sheet'); if (sh) sh.style.animation = 'none';
    }
    document.querySelector('.phone').appendChild(v.overlay);
    S._sheetShown = true;
  } else S._sheetShown = false;
  document.querySelectorAll('.toast').forEach(t => t.remove());
  if (S.flash) {
    const tst = el('div', { class: 'toast' }, [
      el('span', { class: 't', text: S.flash.title }),
      S.flash.desc ? el('span', { class: 'd', text: S.flash.desc }) : null,
    ]);
    document.querySelector('.phone').appendChild(tst);
  }
  document.getElementById('hint').textContent = v.hint || '';
}

render();
</script>
</body>
</html>
